name: Special Stones test
on:
  push:
    branches:
      [
        codex/special-stones-test-foundation,
        feat/special-stones-production-preparation,
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated service dependencies
        run: npm ci --prefix services/special-stones
      - name: Verify authentication, billing and entitlements
        run: npm test --prefix services/special-stones
      - name: Install pinned browser test runner
        run: npm install --prefix services/special-stones --no-save --package-lock=false @playwright/test@1.64.1
      - name: Install Chromium
        run: services/special-stones/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify member navigation, checkout return and reader
        run: node services/special-stones/test/test-screen.browser.mjs

      - name: Verify production member screen (mock only)
        if: github.ref_name == 'feat/special-stones-production-preparation'
        run: node services/special-stones/test/production-screen.browser.mjs

  public-site:
    if: github.ref_name == 'feat/special-stones-production-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build existing site and premium pages with sales disabled
        run: npm run build
        env:
          PUBLIC_SPECIAL_STONES_SALES_ENABLED: 'false'
          PUBLIC_SPECIAL_STONES_MEMBERS_ENABLED: 'false'
      - name: Check public navigation, article index and absence of private media
        run: node services/special-stones/test/public-catalog-build.mjs
