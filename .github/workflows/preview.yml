name: Deploy independent preview
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to preview (main recommended; not production release)
        required: true
        default: main
      search_launch:
        description: 'Publish approved search settings (main only; deploys to Pages)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: independent-pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # Keep the existing GitHub Pages subpath until the domain launch is explicitly enabled.
      SITE_URL: ${{ vars.ALMEAGEM_DOMAIN_LAUNCH == 'true' && 'https://almeagem.com' || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.ALMEAGEM_DOMAIN_LAUNCH == 'true' && '/' || format('/{0}', github.event.repository.name) }}
      PUBLIC_LAUNCH: ${{ vars.SEARCH_PUBLICATION_ENABLED == 'true' && (github.event_name == 'push' || (inputs.search_launch && inputs.ref == 'main')) && 'true' || 'false' }}
      PUBLIC_SEARCH_INDEXING: ${{ vars.SEARCH_PUBLICATION_ENABLED == 'true' && (github.event_name == 'push' || (inputs.search_launch && inputs.ref == 'main')) && 'true' || 'false' }}
      PUBLIC_PHOTO_API_ORIGIN: ${{ vars.PUBLIC_PHOTO_API_ORIGIN }}
    steps:
      - name: Reject search publication from a non-main ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.search_launch && inputs.ref != 'main' }}
        run: |
          echo 'Search publication is allowed only for main.' >&2
          exit 1
      - name: Require explicit publication gate and prevent preview rollback
        if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.search_launch && vars.SEARCH_PUBLICATION_ENABLED != 'true') || (!inputs.search_launch && vars.SEARCH_PUBLICATION_ENABLED == 'true')) }}
        run: |
          echo 'The search publication gate and selected mode must agree.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record preview source
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'Requested ref: %s\nChecked-out commit: %s\n' "$REQUESTED_REF" "$SOURCE_SHA"
          printf '### Preview source\n\nRequested ref: `%s`\n\nChecked-out commit: `%s`\n' "$REQUESTED_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Verify search publication before uploading
        if: ${{ env.PUBLIC_SEARCH_INDEXING == 'true' }}
        run: node scripts/verify-seo-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify chapter seven artwork on the public domain
        if: ${{ vars.ALMEAGEM_DOMAIN_LAUNCH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://almeagem.com/special-stones
          curl -fsSL --retry 3 --retry-all-errors --max-time 20 "$base/chapter-seven/?v=${GITHUB_SHA}" -o /tmp/chapter-seven.html
          curl -fsSL --retry 3 --retry-all-errors --max-time 20 "$base/?v=${GITHUB_SHA}" -o /tmp/chapter-seven-catalog.html
          grep -Fq '07_chapter_quartz_edition2.jpg' /tmp/chapter-seven-catalog.html
          for name in 07_chapter_quartz_edition2.jpg ch7-quartz-in-quartz-v2.png ch7-angel-ladder-quartz-v2.png ch7-aurora-quartz-v2.png ch7-agate-in-quartz-v2.png ch7-stibnite-in-quartz-v2.png ch7-hematite-in-quartz-v2.png ch7-dumortierite-in-quartz-v2.png ch7-ajoite-in-quartz-v2.png ch7-papagoite-in-quartz-v2.png; do
            grep -Fq "$name" /tmp/chapter-seven.html
            curl -fsSL --retry 3 --retry-all-errors --max-time 20 "$base/$name" -o /tmp/ch7-artwork
            case "$name" in
              *.jpg) file --mime-type /tmp/ch7-artwork | grep -Fq 'image/jpeg' ;;
              *.png) file --mime-type /tmp/ch7-artwork | grep -Fq 'image/png' ;;
            esac
            echo "Public artwork OK: $name"
          done
