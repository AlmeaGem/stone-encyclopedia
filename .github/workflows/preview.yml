name: Deploy independent preview
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to preview (main recommended; not production release)
        required: true
        default: main
      search_launch:
        description: 'Publish approved search settings (main only; deploys to Pages)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: independent-pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
      PUBLIC_LAUNCH: ${{ github.event_name == 'workflow_dispatch' && inputs.search_launch && inputs.ref == 'main' && 'true' || 'false' }}
      PUBLIC_SEARCH_INDEXING: ${{ github.event_name == 'workflow_dispatch' && inputs.search_launch && inputs.ref == 'main' && 'true' || 'false' }}
      PUBLIC_PHOTO_API_ORIGIN: ${{ vars.PUBLIC_PHOTO_API_ORIGIN }}
    steps:
      - name: Reject search publication from a non-main ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.search_launch && inputs.ref != 'main' }}
        run: |
          echo 'Search publication is allowed only for main.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record preview source
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'Requested ref: %s\nChecked-out commit: %s\n' "$REQUESTED_REF" "$SOURCE_SHA"
          printf '### Preview source\n\nRequested ref: `%s`\n\nChecked-out commit: `%s`\n' "$REQUESTED_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Verify search publication before uploading
        if: ${{ env.PUBLIC_SEARCH_INDEXING == 'true' }}
        run: node scripts/verify-seo-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4
