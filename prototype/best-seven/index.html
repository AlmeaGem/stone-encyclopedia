<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>BEST 7 非公開検証</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>ALMÉA GEM <small>BEST7_TRIAL_NOT_APPROVED</small></header>
    <main>
      <h1>BEST 7 非公開検証</h1>
      <p class="notice">
        編集審査中の20石を使った実験です。正式な推薦ではなく、石の効果や願いの実現を保証しません。
      </p>
      <form id="trial-form">
        <label>最優先の願い<select name="primary" required></select></label
        ><label>第2の願い（任意）<select name="secondary1"></select></label
        ><label>第3の願い（任意）<select name="secondary2"></select></label
        ><label
          >好きな色（任意）<select name="color">
            <option value="">指定しない</option>
            <option>ピンク</option>
            <option>青</option>
            <option>緑</option>
          </select></label
        ><label
          >雰囲気（任意）<select name="mood">
            <option value="">指定しない</option>
            <option>透明感</option>
            <option>模様</option>
          </select></label
        ><label
          >用途（任意）<select name="form">
            <option value="">指定しない</option>
            <option>スフィア</option>
            <option>ブレスレット</option>
          </select></label
        ><label
          >避けたい特徴（任意）<select name="avoid">
            <option value="">指定しない</option>
            <option>濃い色</option>
            <option>模様が多い</option>
          </select></label
        ><button type="submit">試作結果を確認</button>
      </form>
      <section id="results" aria-live="polite"></section>
    </main>
  </body>
</html>
