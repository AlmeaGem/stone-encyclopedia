<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ALMÉA GEM · 編集者ログイン</title>
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <main class="login">
      <p class="eyebrow">ALMÉA GEM / PRIVATE EDITOR</p>
      <h1>編集者ログイン</h1>
      <p>
        公開サイトとは別のローカル編集画面です。専用パスフレーズを入力してください。
      </p>
      <form id="login">
        <label
          >パスフレーズ<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="256" /></label
        ><button>ログイン</button>
      </form>
      <p id="status" role="alert"></p>
    </main>
    <script type="module" src="/login.js" defer></script>
  </body>
</html>
